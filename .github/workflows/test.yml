name: Run Tests

on:
  push:
    branches: [ main, uxue ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r back_front/requirements.txt
          pip install pytest pytest-flask requests selenium webdriver-manager
      
      - name: Install Chrome browser
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      
      - name: Run unit tests
        run: |
          python -m pytest tests/test_unitarios.py -v
      
      - name: Run integration tests
        run: |
          python -m pytest tests/test_integracion.py -v
      
      - name: Run functional tests (Azure)
        run: |
          python -m pytest tests/test_funcionales_azure.py -v