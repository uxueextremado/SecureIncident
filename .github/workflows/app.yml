name: App Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        type: choice
        options:
          - deploy
        default: 'deploy'
        required: true
  workflow_call:
    inputs:
      action:
        description: 'Acción a ejecutar'
        type: string
        default: 'deploy'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    name: Application Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy application
        run: |
          echo "Zipping application..."
          mkdir -p deploy_tmp
          cp -r back_front/* deploy_tmp/
          cd deploy_tmp
          zip -r ../app.zip .
          cd ..
          echo "Application zipped"
          echo "Deploying to App Service..."
          az webapp deployment source config-zip \
            --resource-group rg-secureincident \
            --name webapp-secureincident \
            --src app.zip
          echo "Deployment complete"