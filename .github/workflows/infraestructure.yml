name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        type: choice
        options:
          - apply
          - destroy
        default: 'apply'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Infrastructure (${{ inputs.action }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove blocking Action Group
        if: inputs.action == 'destroy'
        run: |
          echo "Removing blocking Action Group..."
          az monitor action-group delete --name "Application Insights Smart Detection" --resource-group rg-secureincident --yes || true
          echo "Action Group removed"

      - name: Remove secrets and policies from Terraform state
        if: inputs.action == 'destroy'
        working-directory: infrastructure/
        run: |
          echo "Removing secrets and policies from state..."
          terraform state rm azurerm_key_vault_secret.db_password || true
          terraform state rm azurerm_key_vault_access_policy.current_user || true
          terraform state rm azurerm_key_vault_access_policy.managed_identity || true
          terraform state rm azurerm_key_vault.secureincident_vault || true
          echo "Secrets and policies removed from state"

      - name: Terraform Init
        working-directory: infrastructure/
        run: terraform init

      - name: Delete Key Vault
        if: inputs.action == 'destroy'
        run: |
          echo "Deleting Key Vault..."
          az keyvault delete --name kv-secureincident2 --resource-group rg-secureincident || true
          echo "Key Vault deleted"

      - name: Purge Key Vault
        if: inputs.action == 'destroy'
        run: |
          echo "Purging Key Vault..."
          az keyvault purge --name kv-secureincident2 --location spaincentral --no-wait || true
          echo "Key Vault purged"

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: infrastructure/
        run: |
          echo "Destroying infrastructure..."
          terraform destroy -auto-approve \
            -var="db_password=${{ secrets.TF_VAR_db_password }}" \
            -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
            -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
            -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
            -var="github_repo_url=${{ vars.REPO_URL }}"
          echo "Infrastructure destroyed"

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: infrastructure/
        run: |
          echo "Applying infrastructure..."
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.TF_VAR_db_password }}" \
            -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
            -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
            -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
            -var="github_repo_url=${{ vars.REPO_URL }}"
          echo "Infrastructure applied"