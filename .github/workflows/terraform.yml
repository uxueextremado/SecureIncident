name: Deploy SecureIncident

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        type: choice
        options:
          - apply
          - destroy
        default: 'apply'
        required: true
      component:
        description: 'Componente a desplegar'
        type: choice
        options:
          - all
          - infrastructure
          - app
        default: 'all'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Infrastructure (${{ inputs.action }})
    if: inputs.component == 'all' || inputs.component == 'infrastructure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Destroy - Remove Application Insights and Action Group
        if: inputs.action == 'destroy' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        run: |
          echo "=== DISABLING SMART DETECTION ==="
          az monitor app-insights component update \
            --resource-group rg-secureincident \
            --app insights-secureincident \
            --disable-smart-detection true || true
          
          echo "=== DELETING APPLICATION INSIGHTS ==="
          az monitor app-insights component delete \
            --resource-group rg-secureincident \
            --app insights-secureincident \
            --yes || true
          
          echo "=== WAITING FOR PROPAGATION (30s) ==="
          sleep 30
          
          echo "=== FORCE REMOVING ACTION GROUP ==="
          az monitor action-group delete \
            --name "Application Insights Smart Detection" \
            --resource-group rg-secureincident \
            --yes || true
          
          echo "=== VERIFYING ACTION GROUP IS GONE ==="
          az monitor action-group list --resource-group rg-secureincident --output table || echo "No action groups found"

      - name: Destroy - Remove secrets and policies from Terraform state
        if: inputs.action == 'destroy' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        working-directory: infrastructure/
        run: |
          echo "Removing secrets and policies from state..."
          terraform state rm azurerm_key_vault_secret.db_password || true
          terraform state rm azurerm_key_vault_access_policy.current_user || true
          terraform state rm azurerm_key_vault_access_policy.managed_identity || true
          terraform state rm azurerm_key_vault.secureincident_vault || true
          echo "Secrets and policies removed from state"

      - name: Destroy - Terraform Init
        working-directory: infrastructure/
        run: terraform init

      - name: Destroy - Delete Key Vault
        if: inputs.action == 'destroy' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        run: |
          echo "Deleting Key Vault..."
          az keyvault delete --name kv-secureincident2 --resource-group rg-secureincident || true
          echo "Key Vault deleted"

      - name: Destroy - Purge Key Vault
        if: inputs.action == 'destroy' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        run: |
          echo "Purging Key Vault..."
          az keyvault purge --name kv-secureincident2 --location spaincentral --no-wait || true
          echo "Key Vault purged"

      - name: Destroy - Terraform Destroy
        if: inputs.action == 'destroy' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        working-directory: infrastructure/
        run: |
          echo "Destroying infrastructure..."
          terraform destroy -auto-approve \
            -var="db_password=${{ secrets.TF_VAR_db_password }}" \
            -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
            -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
            -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
            -var="github_repo_url=${{ vars.REPO_URL }}"
          echo "Infrastructure destroyed"

      - name: Apply - Terraform Init
        if: inputs.action == 'apply' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        working-directory: infrastructure/
        run: terraform init

      - name: Apply - Terraform Apply
        if: inputs.action == 'apply' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        working-directory: infrastructure/
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.TF_VAR_db_password }}" \
            -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
            -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
            -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
            -var="github_repo_url=${{ vars.REPO_URL }}"

  app:
    name: Application (${{ inputs.action }})
    needs: infrastructure
    if: inputs.component == 'all' || inputs.component == 'app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Zip application
        if: inputs.action == 'apply'
        run: |
          mkdir -p deploy_tmp
          cp -r back_front/* deploy_tmp/
          cd deploy_tmp
          zip -r ../app.zip .
          cd ..

      - name: Deploy to App Service
        if: inputs.action == 'apply'
        run: |
          az webapp deployment source config-zip \
            --resource-group rg-secureincident \
            --name webapp-secureincident \
            --src app.zip

      - name: Destroy application code
        if: inputs.action == 'destroy'
        run: |
          echo "Destroying application code in App Service..."
          mkdir -p empty_app
          cat > empty_app/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>App Destroyed</title></head>
          <body style="font-family: Arial, sans-serif; text-align: center; padding: 50px;">
          <h1>Application Destroyed</h1>
          <p>The application has been removed from App Service.</p>
          <p>Run the workflow with <strong>Action: apply, Component: app</strong> to restore it.</p>
          <hr>
          <small>SecureIncident - Safe Mode</small>
          </body>
          </html>
          EOF
          cd empty_app
          zip -r ../empty.zip .
          cd ..
          az webapp deployment source config-zip \
            --resource-group rg-secureincident \
            --name webapp-secureincident \
            --src empty.zip
          echo "Application code removed from App Service"