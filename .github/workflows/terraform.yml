name: Deploy SecureIncident

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        type: choice
        options:
          - apply
          - destroy
        default: 'apply'
        required: true
      component:
        description: 'Componente a desplegar'
        type: choice
        options:
          - all
          - infrastructure
          - backend
          - frontend
        default: 'all'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infrastructure:
    name: 🏗️ Infrastructure (${{ inputs.action }})
    if: inputs.component == 'all' || inputs.component == 'infrastructure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infrastructure/
        run: terraform init

      - name: Terraform ${{ inputs.action }}
        working-directory: infrastructure/
        run: |
          if [ "${{ inputs.action }}" = "apply" ]; then
            terraform apply -auto-approve \
              -var="db_password=${{ secrets.TF_VAR_db_password }}" \
              -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
              -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
              -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
              -var="github_repo_url=${{ vars.REPO_URL }}"
          else
            terraform destroy -auto-approve \
              -var="db_password=${{ secrets.TF_VAR_db_password }}" \
              -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
              -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
              -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
              -var="github_repo_url=${{ vars.REPO_URL }}"
          fi

      - name: Purge Key Vault (after destroy)
        if: inputs.action == 'destroy' && (inputs.component == 'all' || inputs.component == 'infrastructure')
        run: |
          echo "Recuerda purgar el Key Vault manualmente si vas a recrearlo:"
          echo "az keyvault purge --name kv-secureincident2 --location spaincentral"

  backend:
    name: Backend (${{ inputs.action }})
    if: inputs.component == 'all' || inputs.component == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zip backend
        run: |
          mkdir -p deploy_tmp
          cp -r backend/* deploy_tmp/
          cd deploy_tmp
          zip -r ../backend.zip .
          cd ..

      - name: Deploy backend to App Service
        if: inputs.action == 'apply'
        run: |
          az webapp deploy \
            --name webapp-secureincident \
            --resource-group rg-secureincident \
            --src-path backend.zip \
            --type zip
        continue-on-error: false

  frontend:
    name: Frontend (${{ inputs.action }})
    if: inputs.component == 'all' || inputs.component == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Zip frontend
        run: |
          mkdir -p deploy_tmp
          cp -r frontend/* deploy_tmp/
          cd deploy_tmp
          zip -r ../frontend.zip .
          cd ..

      - name: Deploy frontend to App Service
        if: inputs.action == 'apply'
        run: |
          az webapp deploy \
            --name webapp-secureincident \
            --resource-group rg-secureincident \
            --src-path frontend.zip \
            --type zip
        continue-on-error: false