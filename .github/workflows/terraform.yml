name: Terraform Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.TF_VAR_db_password }}" \
            -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
            -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
            -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
            -var="github_repo_url=${{ vars.REPO_URL }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.TF_VAR_db_password }}" \
            -var="secret_key=${{ secrets.TF_VAR_secret_key }}" \
            -var="default_security_password=${{ secrets.TF_VAR_default_security_password }}" \
            -var="default_employee_password=${{ secrets.TF_VAR_default_employee_password }}" \
            -var="github_repo_url=${{ vars.REPO_URL }}"
