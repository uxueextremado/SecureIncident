name: Solution Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        type: choice
        options:
          - deploy
          - destroy
        default: 'deploy'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Infrastructure Apply
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Infrastructure Deploy
          ref: main
          inputs: '{"action": "apply"}'
          token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}

      - name: Wait for Infrastructure to complete
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let run_id = null;
            
            // Esperar a que el workflow Infrastructure Deploy se inicie
            for (let i = 0; i < 30; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'infrastructure.yml',
                branch: 'main',
                per_page: 1
              });
              if (runs.data.workflow_runs.length > 0) {
                run_id = runs.data.workflow_runs[0].id;
                break;
              }
              await new Promise(r => setTimeout(r, 5000));
            }
            
            if (!run_id) throw new Error("No se encontró el workflow");
            
            // Esperar a que termine
            while (true) {
              const run = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id
              });
              if (run.data.status === 'completed') {
                if (run.data.conclusion === 'success') break;
                throw new Error(`Workflow falló: ${run.data.conclusion}`);
              }
              await new Promise(r => setTimeout(r, 10000));
            }

      - name: Trigger App Deploy
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: App Deploy
          ref: main
          inputs: '{"action": "deploy"}'
          token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Infrastructure Destroy
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Infrastructure Deploy
          ref: main
          inputs: '{"action": "destroy"}'
          token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}